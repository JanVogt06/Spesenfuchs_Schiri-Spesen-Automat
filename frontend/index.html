<!doctype html>
<html lang="de">
  <head>
    <meta charset="UTF-8" />
    <!-- Favicon und Touch-Icon liegen unter src/assets, damit Vite sie mit
         Hash nach /assets baut und sie dauerhaft gecacht werden duerfen. -->
    <link rel="icon" type="image/png" sizes="64x64" href="./src/assets/favicon-64.png" />
    <link rel="apple-touch-icon" href="./src/assets/apple-touch-icon.png" />
    <!-- Manifest, App-Icons und Service Worker liegen in public/ und damit
         direkt in dist/: das Backend reicht Dateien dort unveraendert durch,
         jede andere Adresse bekommt die index.html. -->
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#171717" media="(prefers-color-scheme: dark)" />
    <meta name="apple-mobile-web-app-title" content="Spesenfuchs" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Spesenfuchs — Schiri-Spesen-Automat</title>
    <meta name="description" content="Spesenabrechnungen für Schiedsrichter im Thüringer Fußball-Verband: jede Nacht aus deinen DFBnet-Ansetzungen, nach TFV-Spesenordnung, als Word und PDF. Kostenlos." />
    <meta property="og:type" content="website" />
    <meta property="og:locale" content="de_DE" />
    <meta property="og:site_name" content="Spesenfuchs" />
    <meta property="og:title" content="Spesenfuchs — Abpfiff für den Papierkram" />
    <meta property="og:description" content="Spesenabrechnungen für Schiedsrichter im TFV, jede Nacht aus deinen DFBnet-Ansetzungen. Du trägst nur noch die Kilometer ein. Kostenlos." />
    <script>
      // Theme sofort anwenden um Flackern zu verhindern
      (function() {
        const theme = localStorage.getItem('theme') || 'system';
        const isDark = theme === 'dark' ||
          (theme === 'system' && window.matchMedia('(prefers-color-scheme: dark)').matches);
        if (isDark) {
          document.documentElement.classList.add('dark');
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="./src/main.tsx"></script>
  </body>
</html>
