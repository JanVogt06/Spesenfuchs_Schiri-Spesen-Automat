name: Release

on:
  push:
    tags:
      - 'v*'  # Triggert bei Tags wie v1.0.0, v1.1.2
  workflow_dispatch:
    inputs:
      platforms:
        description: 'Zielplattformen (arm64 wird emuliert und dauert deutlich laenger)'
        default: 'linux/amd64,linux/arm64'

permissions:
  contents: write
  packages: write

jobs:
  release:
    name: Build image and publish release
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Resolve image name
        id: image
        run: |
          owner=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')
          echo "name=ghcr.io/$owner/spesenfuchs" >> "$GITHUB_OUTPUT"

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Collect image tags
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ steps.image.outputs.name }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/v') }}
            type=raw,value=edge,enable=${{ github.event_name == 'workflow_dispatch' }}

      - name: Build and push
        uses: docker/build-push-action@v7
        env:
          DOCKER_BUILD_SUMMARY: false
        with:
          context: .
          platforms: ${{ inputs.platforms || 'linux/amd64,linux/arm64' }}
          push: true
          build-args: |
            APP_VERSION=${{ steps.meta.outputs.version }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Create release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v3
        with:
          generate_release_notes: true
          body: |
            ## Container Image

            ```bash
            docker pull ${{ steps.image.outputs.name }}:${{ steps.meta.outputs.version }}
            ```

            Gebaut für `linux/amd64` und `linux/arm64`.

            ## Starten

            Auf dem Server werden nur zwei Dinge gebraucht: die
            `docker-compose.yml` dieses Tags und ein Ordner `data` daneben.
            Kein Checkout, kein Build.

            ```bash
            mkdir -p spesenfuchs/data && cd spesenfuchs
            curl -O https://raw.githubusercontent.com/${{ github.repository }}/${{ github.ref_name }}/docker-compose.yml
            sed -i 's/:latest/:${{ steps.meta.outputs.version }}/' docker-compose.yml
            docker compose up -d
            ```

            Ohne das `sed` bleibt es bei `latest`, dann aktualisiert jedes
            `docker compose pull` auf die jeweils neueste Version.

            Danach ist die Oberfläche unter http://localhost:8001 erreichbar.
            Fehlt `data/.env`, werden `JWT_SECRET_KEY` und `ENCRYPTION_KEY` beim
            ersten Start erzeugt. **Diese Datei sichern** — ohne sie sind die
            gespeicherten DFB-Zugangsdaten nicht mehr entschlüsselbar.

            ## Aktualisieren

            ```bash
            docker compose pull && docker compose up -d
            ```
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
