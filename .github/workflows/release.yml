name: Release

on:
  push:
    tags:
      - 'v*'  # Triggert bei Tags wie v1.0.0, v1.1.2
  workflow_dispatch:
    inputs:
      platforms:
        description: 'Target platforms (arm64 is emulated and takes considerably longer)'
        default: 'linux/amd64,linux/arm64'

permissions:
  contents: write
  packages: write

jobs:
  # No image from a state whose tests are red
  tests:
    uses: ./.github/workflows/tests.yml

  # And none with which the fetch from DFBnet no longer works
  e2e:
    uses: ./.github/workflows/e2e.yml
    secrets: inherit

  release:
    name: Build image and publish release
    needs: [tests, e2e]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Resolve image name
        id: image
        run: |
          owner=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')
          echo "name=ghcr.io/$owner/spesenfuchs" >> "$GITHUB_OUTPUT"

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Collect image tags
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ steps.image.outputs.name }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/v') }}
            type=raw,value=edge,enable=${{ github.event_name == 'workflow_dispatch' }}

      - name: Build and push
        uses: docker/build-push-action@v7
        env:
          DOCKER_BUILD_SUMMARY: false
        with:
          context: .
          platforms: ${{ inputs.platforms || 'linux/amd64,linux/arm64' }}
          push: true
          build-args: |
            APP_VERSION=${{ steps.meta.outputs.version }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Create release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v3
        with:
          generate_release_notes: true
          body: |
            ## Container Image

            ```bash
            docker pull ${{ steps.image.outputs.name }}:${{ steps.meta.outputs.version }}
            ```

            Built for `linux/amd64` and `linux/arm64`.

            ## Getting started

            On the server you only need two things: the
            `docker-compose.yml` of this tag and a `data` folder next to it.
            No checkout, no build.

            ```bash
            mkdir -p spesenfuchs/data && cd spesenfuchs
            curl -O https://raw.githubusercontent.com/${{ github.repository }}/${{ github.ref_name }}/docker-compose.yml
            sed -i 's/:latest/:${{ steps.meta.outputs.version }}/' docker-compose.yml
            docker compose up -d
            ```

            Without the `sed`, it stays on `latest`, and every
            `docker compose pull` then updates to the newest version.

            Afterwards the interface is reachable at http://localhost:8001.
            If `data/.env` is missing, `JWT_SECRET_KEY` and `ENCRYPTION_KEY` are
            generated on first start. **Back up this file** — without it the
            stored DFB credentials can no longer be decrypted.

            ## Updating

            ```bash
            docker compose pull && docker compose up -d
            ```
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
