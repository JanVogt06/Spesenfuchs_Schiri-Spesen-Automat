name: End-to-end (DFBnet)

# A real fetch with the account from the repository secrets DFB_USERNAME and
# DFB_PASSWORD: login, assignments, master data, seasons, observations,
# match reports, receipts (tests/e2e). Not on every push to every branch -
# each run is a login at DFBnet.
on:
  push:
    branches: [main]
  workflow_dispatch:
  # The release workflow calls this one before it builds an image
  workflow_call:
    secrets:
      DFB_USERNAME:
        required: false
      DFB_PASSWORD:
        required: false

permissions:
  contents: read

# Never two logins with the same account at the same time
concurrency:
  group: e2e-dfbnet
  cancel-in-progress: false

jobs:
  dfbnet:
    name: Gesamtlauf gegen DFBnet
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      DFB_USERNAME: ${{ secrets.DFB_USERNAME }}
      DFB_PASSWORD: ${{ secrets.DFB_PASSWORD }}
    steps:
      # Forks and repos without secrets: skip instead of turning red
      - name: Check credentials
        id: zugang
        run: |
          if [ -n "$DFB_USERNAME" ] && [ -n "$DFB_PASSWORD" ]; then
            echo "vorhanden=true" >> "$GITHUB_OUTPUT"
          else
            echo "::notice::DFB_USERNAME/DFB_PASSWORD are not set as secrets - full run skipped"
            echo "vorhanden=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Checkout code
        if: steps.zugang.outputs.vorhanden == 'true'
        uses: actions/checkout@v7

      # Same version as in the Dockerfile
      - name: Set up Python
        if: steps.zugang.outputs.vorhanden == 'true'
        uses: actions/setup-python@v6
        with:
          python-version: '3.14'
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - name: Install dependencies
        if: steps.zugang.outputs.vorhanden == 'true'
        run: |
          pip install -r requirements-dev.txt
          python -m playwright install --with-deps chromium

      # The repository is public, and so is this log. NOTHING that was read
      # from DFBnet may appear here - not even counts.
      # --show-capture=no: the scraper's loggers write teams and dates;
      # --tb=no and -p no:warnings: no values from tracebacks or warnings.
      # The test only reports a pass or the names of the failed checks. No
      # artifacts, no summary - the throwaway database contains real data and
      # stays on the runner.
      - name: Run end-to-end test
        if: steps.zugang.outputs.vorhanden == 'true'
        env:
          SPESENFUCHS_E2E: '1'
        run: >
          python -m pytest tests/e2e -m e2e -q
          -p no:cacheprovider -p no:warnings --show-capture=no --tb=no
          -o addopts="--strict-markers -rfE"
