name: Tests

on:
  push:
    branches: ['**']
  pull_request:
  # The release workflow calls this one before it builds an image
  workflow_call:

permissions:
  contents: read

jobs:
  backend:
    name: Backend (pytest)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      # Same version as in the Dockerfile
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.14'
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      # No "playwright install": the tests do not start a browser;
      # LibreOffice and SMTP are mocked as well.
      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      - name: Run pytest
        run: python -m pytest --cov=src --cov-report=term-missing:skip-covered

  frontend:
    name: Frontend (lint, types, vitest)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      # Same version as in the Dockerfile
      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version: '26'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Type check
        run: npx tsc -b

      - name: Run vitest
        run: npm test
