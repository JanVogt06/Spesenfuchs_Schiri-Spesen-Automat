# Einzige Quelle fuer die Compose-Konfiguration: unveraendert auf einem Server
# verwendbar, weil keine Build-Anweisung darin steht - es wird nur das fertige
# Image von GHCR gezogen. Im Checkout ergaenzt docker-compose.override.yml
# automatisch "build: ." fuer die lokale Entwicklung.
services:
  spesenfuchs:
    image: ghcr.io/janvogt06/spesenfuchs:latest
    container_name: spesenfuchs
    restart: unless-stopped
    ports:
      - "${SPESEN_PORT:-8001}:8001"
    environment:
      - TZ=${TZ:-Europe/Berlin}
    volumes:
      # Secrets (.env) und Datenbank (app.db)
      - ./data:/data
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8001/api/health').read()"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
