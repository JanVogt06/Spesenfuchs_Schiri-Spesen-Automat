# Single source for the Compose configuration: usable unchanged on a server,
# because it contains no build instruction - it only pulls the finished image
# from GHCR. In a checkout, docker-compose.override.yml automatically adds
# "build: ." for local development.
services:
  spesenfuchs:
    image: ghcr.io/janvogt06/spesenfuchs:latest
    container_name: spesenfuchs
    restart: unless-stopped
    ports:
      - "${SPESEN_PORT:-8001}:8001"
    environment:
      - TZ=${TZ:-Europe/Berlin}
    volumes:
      # Secrets (.env) and database (app.db)
      - ./data:/data
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8001/api/health').read()"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
